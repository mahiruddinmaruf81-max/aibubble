name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f AiBubble.zip ]; then unzip -o AiBubble.zip -d . ; fi
          test -d AiBubble || { echo "AiBubble.zip upload kora hoy nai"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: |
          cd AiBubble
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../AiBubble.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AiBubble-apk
          path: AiBubble.apk

      - name: Publish download link (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest AiBubble.apk --title "AI Bubble APK" --notes "Ei APK phone-e download kore install korun." --target "$GITHUB_SHA"

          
